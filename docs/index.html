<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Mint Kids</title>
<link id="appcss" rel="stylesheet">
</head>
<body>
<!--
  BOOTSTRAP — do not edit this file.

  Tizen's WebView caches the hosted entry page hard: once config.xml points at
  this URL, edits here are invisible until the app is reinstalled. So this file
  stays frozen and pulls the real app with a cache-busting query, which keeps
  the edit-save-restart loop working without repackaging.
-->
<script>
(function () {
  var t = Date.now();
  document.getElementById('appcss').href = 'app.css?t=' + t;
  var s = document.createElement('script');
  s.src = 'app.js?t=' + t;
  document.head.appendChild(s);
})();
</script>
</body>
</html>
